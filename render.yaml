# Render Blueprint — QTL site analytics + SILMARILS demo
# Dashboard: New > Blueprint > connect this repo (Sync after pull)
services:
  - type: web
    name: qtl-analytics
    runtime: docker
    rootDir: analytics-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: VISITOR_DB_PATH
        value: /tmp/qtl_site_visitors.sqlite
  - type: web
    name: silmarils-demo
    runtime: docker
    rootDir: demo
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8765
