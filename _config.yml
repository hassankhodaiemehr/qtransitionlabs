title: "Quantum Transition Labs"
title_separator: " | "
description: "Post-quantum cryptography, secure architecture, and PQC migration for critical infrastructure, government, and enterprise."
tagline: "Quantum-Safe Security & Cryptographic Modernization"
lang: en

theme: jekyll-theme-cayman

markdown: kramdown
kramdown:
  input: GFM

include:
  - assets/css
  - assets/demo
  - _layouts

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

organization:
  email: contact@qtransitionlabs.com
  area_served: Worldwide
  address:
    street: "Suite 250 — PMB 1725, 997 Seymour St"
    city: Vancouver
    region: BC
    postal: V6B 3M1
    country: CA
  knows_about:
    - Post-quantum cryptography
    - Cryptographic modernization
    - NIST PQC standards
    - Quantum-safe architecture
    - Blockchain security
    - Harvest-now-decrypt-later risk
  service_types:
    - PQC readiness assessment
    - PQC migration roadmap
    - Quantum-safe architecture design
    - Executive security advisory
    - Blockchain security engineering
  same_as: []

baseurl: ""
url: "https://www.qtransitionlabs.com"

logo: "/assets/img/favicon.png"

twitter:
  card: summary

author:
  name: Quantum Transition Labs

collections:
  news:
    output: true
    permalink: /news/:name/
    sort_by: date
    sort_order: descending

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/img/favicon.png"
  - scope:
      path: ""
      type: news
    values:
      layout: news
      stylesheet: /assets/css/news.css
