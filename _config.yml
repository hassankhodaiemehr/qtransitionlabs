title: "Quantum Transition Labs"
title_separator: " | "
description: "Post-quantum cryptography, secure architecture, and PQC migration for critical infrastructure, government, and enterprise."
tagline: "Quantum-Safe Security & Cryptographic Modernization"
lang: en

theme: jekyll-theme-cayman

markdown: kramdown
kramdown:
  input: GFM

include:
  - assets/css
  - _layouts

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

baseurl: ""
url: "https://www.qtransitionlabs.com"

logo: "/assets/css/img/logo1.png"

twitter:
  card: summary

author:
  name: Quantum Transition Labs

collections:
  news:
    output: true
    permalink: /news/:name/
    sort_by: date
    sort_order: descending

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/css/img/logo1.png"
  - scope:
      path: ""
      type: news
    values:
      layout: news
      stylesheet: /assets/css/news.css
