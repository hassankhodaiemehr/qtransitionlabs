title: "Quantum Transition Labs"
title_separator: " | "
description: "Research-led post-quantum security engineering—PQC migration programs, quantum-safe architecture, readiness tooling, and SILMARILS ledger authentication for critical infrastructure, government, and enterprise."
tagline: "Quantum-Safe Security & Cryptographic Modernization"
lang: en

theme: jekyll-theme-cayman

markdown: kramdown
kramdown:
  input: GFM

include:
  - assets/css
  - assets/demo
  - _layouts

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

organization:
  email: contact@qtransitionlabs.com
  area_served: Worldwide
  address:
    street: "Suite 250 — PMB 1725, 997 Seymour St"
    city: Vancouver
    region: BC
    postal: V6B 3M1
    country: CA
  knows_about:
    - Post-quantum cryptography
    - NIST ML-KEM, ML-DSA, and SLH-DSA
    - Cryptographic bill of materials (CBOM)
    - SILMARILS designated-verifier authentication
    - Permissioned ledger and blockchain security
    - Quantum-safe architecture and protocol design
    - PKI, HSM, and cloud KMS modernization
    - Harvest-now-decrypt-later risk
    - Crypto-agility
  service_types:
    - PQC readiness assessment and interactive tooling
    - End-to-end PQC migration programs
    - Quantum-safe architecture and protocol engineering
    - SILMARILS TDV authentication for permissioned ledgers
    - Blockchain, Web3, and digital-asset custody hardening
    - AI-assisted cryptographic analysis and monitoring
    - PKI and HSM integration
    - Executive briefings and training
  same_as: []

baseurl: ""
url: "https://www.qtransitionlabs.com"

logo: "/assets/img/favicon.png"

twitter:
  card: summary

author:
  name: Quantum Transition Labs

collections:
  news:
    output: true
    permalink: /news/:name/
    sort_by: date
    sort_order: descending

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/img/favicon.png"
  - scope:
      path: ""
      type: news
    values:
      layout: news
      stylesheet: /assets/css/news.css
