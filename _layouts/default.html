<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="icon" type="image/png" sizes="1024x1024" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/dark.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/pages.css' | relative_url }}">
  {% if page.stylesheet %}
  <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
  {% endif %}
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  {% include nav.html %}

  <main id="main-content" class="container{% if page.full_width %} container-full{% endif %}">
    {{ content }}
  </main>

  <footer class="footer">
    <p>© {{ site.time | date: '%Y' }} {{ site.title }} — {{ site.tagline }}</p>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% if page.script %}
  <script src="{{ page.script | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
