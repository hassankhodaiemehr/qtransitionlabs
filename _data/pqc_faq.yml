- question: What is post‑quantum cryptography (PQC)?
  answer: >-
    PQC refers to cryptographic algorithms designed to resist attacks from large‑scale
    quantum computers. NIST has standardized ML‑KEM (key encapsulation), ML‑DSA and SLH‑DSA
    (digital signatures) for deployment alongside or in place of classical RSA and
    elliptic‑curve schemes.

- question: When do we need to migrate?
  answer: >-
    There is no single deadline for every organization—but data with long confidentiality
    requirements is already exposed to harvest‑now‑decrypt‑later risk. Governments and
    regulators are publishing roadmaps with multi‑year horizons; starting discovery and
    planning now reduces cost and disruption compared to waiting for a mandate.

- question: What is harvest‑now‑decrypt‑later (HNDL)?
  answer: >-
    Adversaries can record encrypted traffic today and decrypt it later once quantum
    computers break current public‑key cryptography. Any secret that must stay confidential
    for 10–20+ years should be protected with quantum‑resilient algorithms—or re‑encrypted—
    before those systems are considered at risk.

- question: Which algorithms should we use?
  answer: >-
    NIST FIPS 203 (ML‑KEM), FIPS 204 (ML‑DSA), and FIPS 205 (SLH‑DSA) are the primary
    standards for new deployments. Selection depends on protocol, performance, certificate
    infrastructure, and interoperability constraints—often starting with hybrid
    classical‑plus‑PQC modes during transition.

- question: What is a cryptographic bill of materials (CBOM)?
  answer: >-
    A CBOM is an inventory of algorithms, libraries, protocols, keys, and dependencies in
    your systems—similar to a software BOM but focused on cryptography. It is the foundation
    for prioritizing migration, measuring progress, and reporting to auditors or regulators.

- question: Do we need hybrid cryptography during transition?
  answer: >-
    Hybrid schemes combine classical and post‑quantum algorithms so you maintain compatibility
    while PQC support matures across your stack. Many organizations use hybrids in TLS, code
    signing, or internal PKI during phased rollout, then simplify as ecosystems catch up.

- question: How long does migration typically take?
  answer: >-
    Full enterprise migration is usually a multi‑year program: discovery (weeks to months),
    roadmap and architecture (months), pilots (quarters), and phased production rollout
    (1–3+ years depending on scale and legacy depth). Early inventory and crypto‑agility
    investments shorten later phases.

