  <div class="quantum-bar__stage">
    <div class="quantum-bar__deck" aria-hidden="true"></div>
    <canvas class="quantum-bar__canvas" width="1200" height="76" aria-hidden="true"></canvas>

    <svg class="quantum-bar__svg quantum-bar__svg--overlay" viewBox="0 0 1200 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="qbar-node-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(180, 210, 255, 1)" />
          <stop offset="100%" stop-color="rgba(15, 98, 254, 0)" />
        </radialGradient>
      </defs>

      <g class="quantum-bar__mesh" stroke="rgba(56, 189, 248, 0.12)" stroke-width="0.65">
        <line x1="0" y1="18" x2="200" y2="54" />
        <line x1="200" y1="54" x2="420" y2="14" />
        <line x1="420" y1="14" x2="640" y2="58" />
        <line x1="640" y1="58" x2="860" y2="16" />
        <line x1="860" y1="16" x2="1080" y2="52" />
        <line x1="1080" y1="52" x2="1200" y2="30" />
        <line x1="280" y1="6" x2="520" y2="66" />
        <line x1="720" y1="8" x2="980" y2="64" />
      </g>

      <g class="quantum-bar__anchors" fill="rgba(120, 169, 255, 0.95)">
        <circle cx="200" cy="36" r="2.4" />
        <circle cx="600" cy="36" r="2.8" />
        <circle cx="1000" cy="36" r="2.2" />
      </g>

      <g class="quantum-bar__pulses" fill="none" stroke="rgba(15, 98, 254, 0.55)" stroke-width="1">
        <circle class="quantum-bar__ripple" cx="200" cy="36" r="6" />
        <circle class="quantum-bar__ripple" cx="600" cy="36" r="6" />
        <circle class="quantum-bar__ripple" cx="1000" cy="36" r="6" />
      </g>

      <g class="quantum-bar__entangle" stroke="rgba(78, 153, 255, 0.28)" stroke-width="0.75">
        <line class="quantum-bar__link" x1="200" y1="36" x2="420" y2="14" />
        <line class="quantum-bar__link" x1="420" y1="14" x2="600" y2="36" />
        <line class="quantum-bar__link" x1="600" y1="36" x2="860" y2="16" />
        <line class="quantum-bar__link" x1="860" y1="16" x2="1000" y2="36" />
        <line class="quantum-bar__link" x1="280" y1="58" x2="720" y2="14" />
        <line class="quantum-bar__link" x1="520" y1="10" x2="980" y2="62" />
      </g>

      <g class="quantum-bar__bloch quantum-bar__bloch--a" transform="translate(88,36)">
        <circle r="16" fill="rgba(15, 98, 254, 0.06)" stroke="rgba(120, 169, 255, 0.35)" stroke-width="0.75" />
        <g class="quantum-bar__bloch-spin">
          <line x1="0" y1="0" x2="0" y2="-12" stroke="rgba(180, 210, 255, 0.9)" stroke-width="1.25" stroke-linecap="round" />
          <circle r="2" cy="-12" fill="url(#qbar-node-glow)" />
        </g>
      </g>

      <g class="quantum-bar__bloch quantum-bar__bloch--b" transform="translate(1112,36)">
        <circle r="16" fill="rgba(15, 98, 254, 0.06)" stroke="rgba(120, 169, 255, 0.35)" stroke-width="0.75" />
        <g class="quantum-bar__bloch-spin">
          <line x1="0" y1="0" x2="10" y2="-8" stroke="rgba(180, 210, 255, 0.9)" stroke-width="1.25" stroke-linecap="round" />
          <circle r="2" cx="10" cy="-8" fill="url(#qbar-node-glow)" />
        </g>
      </g>

      <g class="quantum-bar__orbit" transform="translate(600,36)">
        <ellipse class="quantum-bar__orbit-path" rx="26" ry="11" fill="none" stroke="rgba(120, 169, 255, 0.45)" stroke-width="0.85" />
        <circle class="quantum-bar__orbit-dot" r="2.5" fill="#78a9ff">
          <animateMotion dur="7s" repeatCount="indefinite" path="M 26,0 A 26,11 0 1,1 -26,0 A 26,11 0 1,1 26,0" />
        </circle>
      </g>

      <g class="quantum-bar__nodes">
        <circle class="quantum-bar__node quantum-bar__node--1" cx="-20" cy="36" r="2.4" fill="url(#qbar-node-glow)" />
        <circle class="quantum-bar__node quantum-bar__node--2" cx="-20" cy="28" r="1.8" fill="rgba(120,169,255,0.85)" />
        <circle class="quantum-bar__node quantum-bar__node--3" cx="-20" cy="44" r="1.5" fill="rgba(129,140,248,0.75)" />
        <circle class="quantum-bar__node quantum-bar__node--4" cx="-20" cy="36" r="1.2" fill="rgba(56,189,248,0.7)" />
        <circle class="quantum-bar__node quantum-bar__node--5" cx="-20" cy="34" r="1" fill="rgba(180,210,255,0.65)" />
      </g>
    </svg>

  <div class="quantum-bar__sparks" aria-hidden="true">

    <span class="quantum-bar__spark"></span>

    <span class="quantum-bar__spark"></span>
    <span class="quantum-bar__spark"></span>
    <span class="quantum-bar__spark"></span>
  </div>

  <div class="quantum-bar__scan"></div>
  <div class="quantum-bar__glow"></div>
</div>
