  <svg class="quantum-bar__svg" viewBox="0 0 1200 56" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="qbar-wave-a" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(15, 98, 254, 0.45)" />
        <stop offset="50%" stop-color="rgba(120, 169, 255, 0.95)" />
        <stop offset="100%" stop-color="rgba(15, 98, 254, 0.45)" />
      </linearGradient>
      <linearGradient id="qbar-wave-b" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
        <stop offset="100%" stop-color="rgba(129, 140, 248, 0.65)" />
      </linearGradient>
      <linearGradient id="qbar-wave-c" x1="100%" y1="0%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="rgba(167, 139, 250, 0.35)" />
        <stop offset="100%" stop-color="rgba(15, 98, 254, 0.5)" />
      </linearGradient>
      <linearGradient id="qbar-density" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(15, 98, 254, 0.22)" />
        <stop offset="50%" stop-color="rgba(120, 169, 255, 0.08)" />
        <stop offset="100%" stop-color="rgba(129, 140, 248, 0.18)" />
      </linearGradient>
      <radialGradient id="qbar-node-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(180, 210, 255, 1)" />
        <stop offset="100%" stop-color="rgba(15, 98, 254, 0)" />
      </radialGradient>
    </defs>

      fill="url(#qbar-density)"
      d="M-60,28 C60,10 140,46 240,28 S440,10 540,28 S740,46 840,28 S1040,10 1140,28 L1260,28 C1140,40 1040,18 940,34 S740,48 640,28 S440,12 340,30 S140,44 40,28 S-40,14 -60,28 Z"

      <circle cx="200" cy="28" r="2.4" />
