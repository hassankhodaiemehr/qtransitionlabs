<figure
  class="rh-viz"
  data-rh-viz
  data-zeta-data="{{ '/assets/data/riemann-zeta-critical-line.json' | relative_url }}"
  aria-labelledby="rh-viz-caption"
>
  <div class="rh-viz__head">
    <p class="rh-viz__eyebrow">Numerical simulation</p>
    <h3 class="rh-viz__title">ζ(½ + <em>it</em>) along the critical line</h3>
    <p class="rh-viz__lede">
      Curves are sampled at Δ<em>t</em> = 0.04 from <em>t</em> = 0 to 52 using
      <strong>mpmath</strong> analytic continuation of ζ(<em>s</em>). Use the slider or run the scan to watch
      |ζ|, Re&nbsp;ζ, and Im&nbsp;ζ along the line where RH asserts all nontrivial zeros lie.
    </p>
  </div>
  <div class="rh-viz__frame">
    <div class="rh-viz__panels">
      <div class="rh-viz__panel">
        <div class="rh-viz__panel-head">
          <span class="rh-viz__panel-kicker">Panel A</span>
          <span class="rh-viz__panel-title">|ζ(½ + <em>it</em>)|, Re&nbsp;ζ, Im&nbsp;ζ vs <em>t</em></span>
        </div>
        <svg class="rh-viz__mag-svg" viewBox="0 0 580 280" role="img" aria-label="Numerical zeta values on the critical line versus t">
          <defs>
            <linearGradient id="rh-mag-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(56, 189, 248, 0.35)"/>
              <stop offset="100%" stop-color="rgba(56, 189, 248, 0.02)"/>
            </linearGradient>
            <linearGradient id="rh-mag-stroke" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="50%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
          <rect width="580" height="280" class="rh-viz__panel-bg" rx="8"/>
          <text x="58" y="22" class="rh-viz__axis-title">ζ(½+<tspan font-style="italic">it</tspan>) computed with mpmath · 28-digit precision batch</text>
          <line x1="58" y1="174" x2="558" y2="174" class="rh-viz__axis"/>
          <line x1="58" y1="36" x2="58" y2="174" class="rh-viz__axis"/>
          <line x1="58" y1="250" x2="558" y2="250" class="rh-viz__axis rh-viz__axis--light"/>
          <text x="300" y="272" class="rh-viz__axis-label" text-anchor="middle">imaginary part <tspan font-style="italic">t</tspan></text>
          <text x="22" y="108" class="rh-viz__axis-label" transform="rotate(-90 22 108)">|ζ|</text>
          <text x="22" y="226" class="rh-viz__axis-label" transform="rotate(-90 22 226)">Re / Im</text>
          <text x="62" y="190" class="rh-viz__legend rh-viz__legend--re">Re ζ</text>
          <text x="62" y="202" class="rh-viz__legend rh-viz__legend--im">Im ζ</text>
          <text x="68" y="268" class="rh-viz__tick">0</text>
          <text x="154" y="268" class="rh-viz__tick">10</text>
          <text x="250" y="268" class="rh-viz__tick">20</text>
          <text x="346" y="268" class="rh-viz__tick">30</text>
          <text x="442" y="268" class="rh-viz__tick">40</text>
          <text x="538" y="268" class="rh-viz__tick">50</text>
        </svg>
      </div>
      <div class="rh-viz__panel">
        <div class="rh-viz__panel-head">
          <span class="rh-viz__panel-kicker">Panel B</span>
          <span class="rh-viz__panel-title">Critical strip — zero locations on Re(<em>s</em>) = ½</span>
        </div>
        <svg class="rh-viz__plane-svg" viewBox="0 0 580 320" role="img" aria-label="Complex plane with critical line and detected zero heights">
          <defs>
            <linearGradient id="rh-strip-grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(15, 98, 254, 0.04)"/>
              <stop offset="50%" stop-color="rgba(56, 189, 248, 0.14)"/>
              <stop offset="100%" stop-color="rgba(147, 51, 234, 0.06)"/>
            </linearGradient>
          </defs>
          <rect width="580" height="320" class="rh-viz__panel-bg" rx="8"/>
          <text x="70" y="22" class="rh-viz__axis-title">Marker tracks ½ + <tspan font-style="italic">it</tspan> · zeros from |ζ| minima in dataset</text>
          <text x="70" y="308" class="rh-viz__tick">Re(s)=0</text>
          <text x="285" y="308" class="rh-viz__tick" text-anchor="middle">½</text>
          <text x="546" y="308" class="rh-viz__tick" text-anchor="end">1</text>
          <text x="20" y="288" class="rh-viz__tick">Im=0</text>
          <text x="20" y="88" class="rh-viz__tick">Im≈50</text>
        </svg>
      </div>
    </div>
    <div class="rh-viz__controls">
      <button type="button" class="rh-viz__play" data-rh-play aria-pressed="true">Pause</button>
      <label class="rh-viz__slider-label" for="rh-viz-slider"><em>t</em></label>
      <input class="rh-viz__slider" id="rh-viz-slider" data-rh-slider type="range" min="0" max="52" step="0.04" value="14.13"/>
    </div>
    <div class="rh-viz__hud" aria-live="polite">
      <div class="rh-viz__hud-item"><span class="rh-viz__hud-key"><em>t</em></span><strong data-rh-t-value>0.000</strong></div>
      <div class="rh-viz__hud-item"><span class="rh-viz__hud-key">|ζ|</span><strong data-rh-zeta-value>—</strong></div>
      <div class="rh-viz__hud-item"><span class="rh-viz__hud-key">Re&nbsp;ζ</span><strong data-rh-re-value>—</strong></div>
      <div class="rh-viz__hud-item"><span class="rh-viz__hud-key">Im&nbsp;ζ</span><strong data-rh-im-value>—</strong></div>
      <div class="rh-viz__hud-chip" data-rh-zero-chip>Loading numerical ζ dataset…</div>
    </div>
  </div>
  <figcaption class="rh-viz__caption" id="rh-viz-caption">
    <strong>Data-driven.</strong> Points come from evaluating ζ(½ + <em>it</em>) with mpmath (not a hand-drawn loop). Zeros on the plot are local minima of |ζ| in the sample; they match published heights to ~10<sup>−2</sup> in <em>t</em> at this step size.
  </figcaption>
</figure>
