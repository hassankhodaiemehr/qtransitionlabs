<figure class="rh-viz" data-rh-viz aria-labelledby="rh-viz-caption">
  <div class="rh-viz__head">
    <p class="rh-viz__eyebrow">Interactive schematic</p>
    <h3 class="rh-viz__title">ζ(<em>s</em>) on the critical line &amp; zero locations</h3>
    <p class="rh-viz__lede">
      Along <strong>s = ½ + <em>it</em></strong>, the Riemann zeta function oscillates and drops to
      <strong>zeros</strong> at iconic heights <em>t</em> (14.13, 21.02, …). RH claims every nontrivial zero lies on this line.
    </p>
  </div>
  <div class="rh-viz__frame">
    <div class="rh-viz__panels">
      <div class="rh-viz__panel">
        <div class="rh-viz__panel-head">
          <span class="rh-viz__panel-kicker">Panel A</span>
          <span class="rh-viz__panel-title">|ζ(½ + <em>it</em>)| magnitude</span>
        </div>
        <svg class="rh-viz__mag-svg" viewBox="0 0 580 240" role="img" aria-label="Magnitude of zeta on the critical line versus t">
          <defs>
            <linearGradient id="rh-mag-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(56, 189, 248, 0.45)"/>
              <stop offset="100%" stop-color="rgba(56, 189, 248, 0.02)"/>
            </linearGradient>
            <linearGradient id="rh-mag-stroke" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="50%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#e879f9"/>
            </linearGradient>
            <filter id="rh-glow-strong" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <rect width="580" height="240" class="rh-viz__panel-bg" rx="8"/>
          <text x="58" y="24" class="rh-viz__axis-title">ζ(s) = Σ n<sup>−s</sup> (Re s &gt; 1); continued to critical line</text>
          <line x1="58" y1="204" x2="558" y2="204" class="rh-viz__axis"/>
          <line x1="58" y1="36" x2="58" y2="204" class="rh-viz__axis"/>
          <text x="300" y="228" class="rh-viz__axis-label" text-anchor="middle">imaginary part <tspan font-style="italic">t</tspan></text>
          <text x="22" y="122" class="rh-viz__axis-label" transform="rotate(-90 22 122)">|ζ(½+<tspan font-style="italic">it</tspan>)|</text>
          <text x="68" y="222" class="rh-viz__tick">0</text>
          <text x="154" y="222" class="rh-viz__tick">10</text>
          <text x="250" y="222" class="rh-viz__tick">20</text>
          <text x="346" y="222" class="rh-viz__tick">30</text>
          <text x="442" y="222" class="rh-viz__tick">40</text>
          <text x="538" y="222" class="rh-viz__tick">50</text>
        </svg>
      </div>
      <div class="rh-viz__panel">
        <div class="rh-viz__panel-head">
          <span class="rh-viz__panel-kicker">Panel B</span>
          <span class="rh-viz__panel-title">Critical strip — Re(<em>s</em>) vs Im(<em>s</em>)</span>
        </div>
        <svg class="rh-viz__plane-svg" viewBox="0 0 580 320" role="img" aria-label="Complex plane with critical line and zeta zeros">
          <defs>
            <linearGradient id="rh-strip-grad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(15, 98, 254, 0.04)"/>
              <stop offset="50%" stop-color="rgba(56, 189, 248, 0.16)"/>
              <stop offset="100%" stop-color="rgba(147, 51, 234, 0.08)"/>
            </linearGradient>
          </defs>
          <rect width="580" height="320" class="rh-viz__panel-bg" rx="8"/>
          <text x="70" y="22" class="rh-viz__axis-title">Nontrivial zeros on <tspan font-weight="600">Re(s) = ½</tspan> (known first 10)</text>
          <text x="70" y="308" class="rh-viz__tick">Re(s)=0</text>
          <text x="285" y="308" class="rh-viz__tick" text-anchor="middle">½</text>
          <text x="546" y="308" class="rh-viz__tick" text-anchor="end">1</text>
          <text x="20" y="288" class="rh-viz__tick">Im=0</text>
          <text x="20" y="88" class="rh-viz__tick">Im≈50</text>
        </svg>
      </div>
    </div>
    <div class="rh-viz__hud" aria-live="polite">
      <div class="rh-viz__hud-item"><span class="rh-viz__hud-key"><em>t</em></span><strong data-rh-t-value>0.00</strong></div>
      <div class="rh-viz__hud-item"><span class="rh-viz__hud-key">|ζ(½+<em>it</em>)|</span><strong data-rh-zeta-value>—</strong></div>
      <div class="rh-viz__hud-chip" data-rh-zero-chip>Scanning critical line s = ½ + it</div>
    </div>
  </div>
  <figcaption class="rh-viz__caption" id="rh-viz-caption">
    <strong>Educational model.</strong> The magnitude curve is a smooth visual surrogate (not a certified numerical ζ evaluation). Zeros align with classical heights on the critical line. RH states no zero appears off the orange line in the strip 0 &lt; Re(<em>s</em>) &lt; 1.
  </figcaption>
</figure>
