<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="Quantum Transition Labs home">
      {% include brand-logo.html %}
      <span class="brand-text">
        <span class="brand-name">Quantum Transition Labs</span>
        <span class="brand-abbr">QTL</span>
      </span>
    </a>

    <button
      type="button"
      class="nav-toggle"
      id="nav-toggle"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="site-nav"
    >
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}">Home</a>
      <a href="{{ '/team/' | relative_url }}" class="nav-link{% if page.url contains '/team' %} active{% endif %}">Team</a>
      <a href="{{ '/services/' | relative_url }}" class="nav-link{% if page.url contains '/services' %} active{% endif %}">Services</a>
      <div class="nav-dropdown{% if page.url contains '/pqc-readiness' or page.url contains '/qtl-wallet' or page.url contains '/demo' %} is-active{% endif %}" id="nav-solutions">
        <button
          type="button"
          class="nav-link nav-dropdown__toggle{% if page.url contains '/pqc-readiness' or page.url contains '/qtl-wallet' or page.url contains '/demo' %} active{% endif %}"
          id="nav-solutions-toggle"
          aria-expanded="false"
          aria-haspopup="true"
          aria-controls="nav-solutions-menu"
        >
          Solutions
          <span class="nav-dropdown__chevron" aria-hidden="true"></span>
        </button>
        <ul class="nav-dropdown__menu" id="nav-solutions-menu" role="menu" aria-label="QTL solutions">
          <li role="none">
            <a
              href="{{ '/pqc-readiness/' | relative_url }}"
              class="nav-dropdown__link{% if page.url contains '/pqc-readiness' %} is-current{% endif %}"
              role="menuitem"
            >
              <strong>PQC Readiness</strong>
              <span>Self‑assessment &amp; migration FAQ</span>
            </a>
          </li>
          <li role="none">
            <a
              href="{{ '/demo/' | relative_url }}"
              class="nav-dropdown__link{% if page.url contains '/demo' %} is-current{% endif %}"
              role="menuitem"
            >
              <strong>SILMARILS Demo</strong>
              <span>Live ledger authentication demo</span>
            </a>
          </li>
          <li role="none">
            <a
              href="{{ '/qtl-wallet/' | relative_url }}"
              class="nav-dropdown__link{% if page.url contains '/qtl-wallet' %} is-current{% endif %}"
              role="menuitem"
            >
              <strong>QTL Wallet</strong>
              <span>SIM‑centric custody</span>
            </a>
          </li>
        </ul>
      </div>
      <a href="{{ '/research/' | relative_url }}" class="nav-link{% if page.url contains '/research' %} active{% endif %}">Research</a>
      <a href="{{ '/education/' | relative_url }}" class="nav-link{% if page.url contains '/education' %} active{% endif %}">Education</a>
      <a href="{{ '/news/' | relative_url }}" class="nav-link{% if page.url contains '/news' %} active{% endif %}">News</a>
      <a href="{{ '/contact/' | relative_url }}" class="nav-cta{% if page.url contains '/contact' %} nav-cta--active{% endif %}">Contact us</a>

      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Toggle dark and light mode"
      >
        <span class="theme-icon theme-icon-dark" aria-hidden="true">☀</span>
        <span class="theme-icon theme-icon-light" aria-hidden="true">🌙</span>
      </button>
    </nav>
  </div>
</header>
