<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="Quantum Transition Labs home">
      {% include brand-logo.html %}
      <span class="brand-text">
        <span class="brand-name">Quantum Transition Labs</span>
        <span class="brand-abbr">QTL</span>
      </span>
    </a>

    <button
      type="button"
      class="nav-toggle"
      id="nav-toggle"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="site-nav"
    >
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}">Home</a>
      <a href="{{ '/team/' | relative_url }}" class="nav-link{% if page.url contains '/team' %} active{% endif %}">Team</a>
      <a href="{{ '/services/' | relative_url }}" class="nav-link{% if page.url contains '/services' %} active{% endif %}">Services</a>
      <a href="{{ '/research/' | relative_url }}" class="nav-link{% if page.url contains '/research' %} active{% endif %}">Research</a>
      <a href="{{ '/news/' | relative_url }}" class="nav-link{% if page.url contains '/news' %} active{% endif %}">News</a>
      <a href="{{ '/contact/' | relative_url }}" class="nav-link{% if page.url contains '/contact' %} active{% endif %}">Contact</a>

      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Toggle dark and light mode"
      >
        <span class="theme-icon theme-icon-dark" aria-hidden="true">☀</span>
        <span class="theme-icon theme-icon-light" aria-hidden="true">🌙</span>
      </button>
    </nav>
  </div>
</header>
